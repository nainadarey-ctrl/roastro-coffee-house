<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Stylized Coffee Leaves / Beans over the OA -->
  <g transform="translate(198, 12)">
    <path d="M-10 14 C-16 6 -8 0 0 0 C-2 8 -6 12 -10 14 Z" fill="#6B4938" />
    <path d="M10 14 C16 6 8 0 0 0 C2 8 6 12 10 14 Z" fill="#3B241C" />
    <circle cx="0" cy="1" r="1.5" fill="#C5A059" />
  </g>
  
  <!-- Main Brand Name: ROASTRO -->
  <text x="210" y="58" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="6" fill="#3B241C">
