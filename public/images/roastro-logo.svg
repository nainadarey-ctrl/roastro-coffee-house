  </text>
  
  <!-- Subtle divider lines -->
  <line x1="80" y1="76" x2="140" y2="76" stroke="#D9C6AE" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="147" cy="76" r="2" fill="#C5A059" />
  
  <!-- Subtitle: COFFEE HOUSE & CAFÉ -->
  <text x="210" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.5" fill="#6B4938">
    COFFEE &amp; EATERY
  </text>
  
  <circle cx="273" cy="76" r="2" fill="#C5A059" />
  <line x1="280" y1="76" x2="340" y2="76" stroke="#D9C6AE" stroke-width="1.2" stroke-linecap="round" />

  <text x="210" y="98" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="10.5" letter-spacing="1.5" fill="#73745B">
    Alwar • Rajasthan
